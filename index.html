<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interactive 3D viewer — Golden Rock</title>
<style>
  @font-face{font-family:"Cormorant Garamond";src:url("./fonts/cormorant-garamond-v21-latin.woff2") format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("./fonts/cormorant-garamond-v21-italic-latin.woff2") format("woff2");font-weight:400 700;font-style:italic;font-display:swap}
  /* A dark product-photography studio — one committed look, set explicitly. */
  :root{
    color-scheme: dark;
    --fg:#f4efe4; --muted:#9aa1ad; --line:rgba(244,239,228,.12);
    --gold:#c8a35a; --gold-bright:#e7c781; --panel:rgba(18,20,27,.72);
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;font-family:var(--ui);color:var(--fg);overflow:hidden;-webkit-font-smoothing:antialiased;
    background:radial-gradient(120% 90% at 50% 30%,#20242e 0%,#11131a 45%,#07080b 100%);}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  .brand{position:fixed;left:0;top:0;padding:16px 18px 0;pointer-events:none;z-index:5}
  .brand .mark{font-family:var(--display);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1}
  .brand .mark b{color:var(--gold)}
  .brand .kick{margin-top:5px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

  #pins{position:fixed;inset:0;z-index:4;pointer-events:none}
  .pin{position:absolute;transform:translate(-50%,-50%);transition:opacity .2s}
  .pin .dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(200,163,90,.22),0 0 12px rgba(231,199,129,.5);margin:0 auto}
  .pin .tag{position:absolute;left:16px;top:-9px;white-space:nowrap;font-size:12px;color:var(--fg);background:rgba(10,11,14,.82);border:1px solid var(--line);border-radius:7px;padding:5px 9px}

  .hint{position:fixed;left:0;right:0;top:calc(50% + 150px);text-align:center;z-index:3;pointer-events:none;font-size:12.5px;letter-spacing:.03em;color:var(--muted);transition:opacity .6s;padding:0 16px}

  .panel{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:min(640px,calc(100vw - 28px));z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:16px;
    backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.5);padding:13px 15px}
  .plabel{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 2px 9px}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);border-radius:999px;padding:6px 12px 6px 7px;font:inherit;font-size:13px;line-height:1;transition:border-color .15s,background .15s}
  .sw:hover{background:rgba(255,255,255,.07)}
  .sw .chip{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex:none}
  .sw[aria-pressed="true"]{border-color:var(--gold);background:rgba(200,163,90,.14)}
  .sw:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .btn{cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--fg);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;line-height:1;transition:border-color .15s,background .15s}
  .btn:hover{background:rgba(255,255,255,.08)}
  .btn[aria-pressed="true"]{border-color:var(--gold);background:rgba(200,163,90,.16);color:var(--gold-bright)}
  .btn:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px}

  .fallback{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px;z-index:7}
  .fallback .fb-gem{font-size:54px;color:var(--gold);text-shadow:0 0 30px rgba(231,199,129,.45)}
  .fallback h2{font-family:var(--display);font-weight:700;font-size:26px;margin:4px 0 0}
  .fallback p{color:var(--muted);max-width:30ch;margin:0;font-size:14px;line-height:1.5}

  @media (max-width:520px){ .panel{width:calc(100vw - 20px)} .pin .tag{display:none} .hint{top:auto;bottom:calc(190px + env(safe-area-inset-bottom,0px))} }
  @media (prefers-reduced-motion:reduce){ .pin{transition:none} }
</style>
</head>
<body>
<div id="stage" aria-label="Interactive 3D viewer"></div>
<div id="pins" aria-hidden="true"></div>
<header class="brand"><div class="mark">Golden&nbsp;<b>Rock</b></div><div class="kick">Interactive 3D</div></header>
<p class="hint" id="hint">Drag to rotate &middot; scroll or pinch to zoom</p>
<section class="panel" id="panel" aria-label="Viewer controls">
  <p class="plabel">Finish &mdash; swap it live</p>
  <div class="swatches" id="swatches"></div>
  <div class="row">
    <button class="btn" id="spin" type="button" aria-pressed="true">Auto-spin</button>
    <button class="btn" id="labels" type="button" aria-pressed="true">Labels</button>
    <button class="btn" id="reset" type="button">Reset view</button>
  </div>
</section>
<div class="fallback" id="fallback" hidden>
  <div class="fb-gem" aria-hidden="true">&#9670;</div>
  <h2>Interactive 3D product viewer</h2>
  <p>Open this page on a desktop browser to spin, zoom and reconfigure the model in real time.</p>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
